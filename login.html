<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport" />
    <title>Log in – Muscle Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Inter:wght@400;500&amp;display=swap"
      rel="stylesheet" />
    <link href="css/style.css?v=auth-input-height" rel="stylesheet" />
    <script src="js/auth.js?v=password-eye" defer></script>
  </head>
  <body class="auth" data-page="login">
    <form class="auth-card" method="post">
      <a class="logo" href="index.html"><img src="images/musclehub-logo.svg" alt="Muscle Hub" width="256" height="178" /></a>
      <h1>Log in</h1>
      <p>Welcome back to Muscle Hub.</p>
      <label>Email<input
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required=""
          type="email" /></label>
      <div class="auth-password">
        <label for="auth-password">Password</label>
        <div class="auth-password-field">
          <input id="auth-password"
            name="password"
            autocomplete="current-password"
            placeholder="Your password"
            required=""
            type="password" />
          <button class="password-toggle" type="button" aria-controls="auth-password" aria-label="Show password" hidden><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18M10.6 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.1 6.1A18 18 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></button>
        </div>
      </div>
      <button class="btn" type="submit" disabled>Log in</button>
      <p class="alt">New to Muscle Hub? <a href="signup.html">Sign up</a></p>
    </form>
  </body>
</html>
